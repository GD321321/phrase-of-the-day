<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>ביטוי אחד ביום</title>
  <style>
    :root {
      --bg: #0f1115;
      --card: #181b22;
      --border: #2a2f3a;
      --text: #eceef3;
      --muted: #9aa1b0;
      --accent-1: #22d3ee;   /* טורקיז */
      --accent-2: #a78bfa;   /* סגול */
      --yes: #4ade80;
      --yes-bg: rgba(74, 222, 128, 0.08);
      --no: #fb7185;
      --no-bg: rgba(251, 113, 133, 0.08);
      --example-bg: #1f2430;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      background:
        radial-gradient(circle at 85% 0%, rgba(167, 139, 250, 0.14), transparent 45%),
        radial-gradient(circle at 10% 100%, rgba(34, 211, 238, 0.10), transparent 45%),
        var(--bg);
      background-attachment: fixed;
      color: var(--text);
      font-family: "Segoe UI", Arial, "Noto Sans Hebrew", sans-serif;
      line-height: 1.65;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px 16px;
    }
    main { width: 100%; max-width: 520px; }
    .date {
      color: var(--muted);
      font-size: 0.9rem;
      text-align: center;
      margin-bottom: 14px;
      letter-spacing: 0.02em;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 28px 22px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.45);
    }
    .label {
      color: var(--accent-1);
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      margin: 0 0 6px;
    }
    .tag {
      display: inline-block;
      font-size: 0.78rem;
      font-weight: 600;
      padding: 3px 12px;
      border-radius: 999px;
      margin-bottom: 14px;
      border: 1px solid currentColor;
    }
    .tag:empty { display: none; }
    .tag.daily    { color: var(--accent-1); background: rgba(34, 211, 238, 0.10); }
    .tag.finance  { color: var(--yes);      background: rgba(74, 222, 128, 0.10); }
    .tag.thinking { color: var(--accent-2); background: rgba(167, 139, 250, 0.12); }
    h1 {
      font-size: 2.1rem;
      line-height: 1.3;
      margin: 0 0 6px;
      overflow-wrap: anywhere;
      background: linear-gradient(90deg, var(--accent-1), var(--accent-2));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .source {
      color: var(--muted);
      font-size: 0.85rem;
      margin: 0 0 18px;
    }
    .source:empty { display: none; }
    .divider {
      height: 1px;
      background: var(--border);
      margin: 18px 0 20px;
    }
    .meaning { font-size: 1.05rem; margin: 0 0 22px; }
    .usage {
      display: grid;
      gap: 12px;
      margin-bottom: 22px;
    }
    .box {
      border-radius: 14px;
      padding: 12px 14px;
      border: 1px solid transparent;
    }
    .box h2 {
      font-size: 0.9rem;
      margin: 0 0 4px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .box p { margin: 0; font-size: 0.98rem; }
    .yes { background: var(--yes-bg); border-color: rgba(74, 222, 128, 0.25); }
    .yes h2 { color: var(--yes); }
    .no { background: var(--no-bg); border-color: rgba(251, 113, 133, 0.25); }
    .no h2 { color: var(--no); }
    .example {
      background: var(--example-bg);
      border-right: 3px solid var(--accent-2);
      border-radius: 12px;
      padding: 14px 16px;
      margin: 0;
      font-size: 1.02rem;
      font-style: italic;
    }
    footer {
      color: var(--muted);
      font-size: 0.82rem;
      text-align: center;
      margin-top: 16px;
    }
  </style>
</head>
<body>

      <div class="divider"></div>

        <div class="box yes">

        </div>
        <div class="box no">

        </div>
      </div>

      <p class="label">לדוגמה</p>
      <p class="example" id="example"></p>
    </article>
    <footer>ביטוי חדש בכל יום</footer>
  </main>

    // ===== סוף הרשימה. מכאן והלאה אין צורך לשנות =====

    // מספר הימים מאז 1.1.1970 לפי התאריך המקומי (בלי שעות),
    // כך שכל היום מוצג אותו ביטוי ולמחרת הביטוי הבא.
    function dayNumber(date) {
      return Math.floor(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()) / 86400000);
    }

    function phraseForDate(date) {
      return phrases[dayNumber(date) % phrases.length];
    }

    const today = new Date();
    const item = phraseForDate(today);

    document.getElementById("date").textContent = today.toLocaleDateString("he-IL", {
      weekday: "long", day: "numeric", month: "long", year: "numeric"
    });
    // צבע התגית לפי הקטגוריה
    const tagClasses = {
      "יומיומי וכללי": "daily",
      "פיננסים וכלכלה": "finance",
      "חשיבה והיגיון": "thinking",
    };
    const tag = document.getElementById("tag");
    tag.textContent = item.category || "";
    tag.className = "tag " + (tagClasses[item.category] || "daily");

    document.getElementById("phrase").textContent = item.phrase;
    document.getElementById("source").textContent = item.source ? "מקור: " + item.source : "";
    document.getElementById("meaning").textContent = item.meaning;
    document.getElementById("use").textContent = item.use;
    document.getElementById("avoid").textContent = item.avoid;
    document.getElementById("example").textContent = item.example;
  </script>
</body>
</html>
